name: Weekly leads detection

on:
  schedule:
    - cron: "0 6 * * 1"  # tous les lundis à 06h00 UTC (08h00 Paris en été, 07h00 en hiver)
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: lead-detection
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: lead-detection/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          INSEE_API_KEY: ${{ secrets.INSEE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SAMPLE_SIZE: "1500"
          TOP_N: "25"
        run: python -m src.main

      - name: Upload CSV artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_id }}
          path: lead-detection/data/*.csv
          retention-days: 90
