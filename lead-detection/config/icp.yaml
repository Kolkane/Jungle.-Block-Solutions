# ICP — Ideal Customer Profile pour Jungle.Block Solutions
# Cible : PME françaises 35-150 salariés, France métropolitaine, secteurs ciblés.

# Filtres durs appliqués à la collecte Sirene.
hard_filters:
  effectif_min: 35
  effectif_max: 150
  age_minimum_annees: 2

# Codes NAF organisés en 3 tiers.
# - Une entreprise hors de ces 3 tiers (et non exclue) est ignorée : on ne génère
#   pas de copy Claude pour elle.
# - tier_3 : score final doit être >= min_score pour être gardé.
naf_tiers:
  tier_1:
    bonus: 15
    naf_codes: ["46", "28", "25", "29", "52", "69.20Z", "49.41A", "49.41B"]
  tier_2:
    bonus: 8
    naf_codes: ["21", "71.12B", "70.22Z", "46.73", "46.74", "47.74Z"]
  tier_3:
    bonus: 0
    min_score: 53
    naf_codes: ["68.31Z", "78", "45.11Z", "45.19Z"]

# Refus immédiat : on ne fetch même pas ces entreprises au-delà du filtre Sirene.
naf_exclude_prefixes:
  - "41"   # Construction de bâtiments
  - "42"   # Génie civil
  - "43"   # Travaux de construction spécialisés
  - "55"   # Hébergement
  - "56"   # Restauration
  - "64"   # Activités des services financiers
  - "65"   # Assurance
  - "66"   # Activités auxiliaires services financiers
  - "85"   # Enseignement
  - "86"   # Santé humaine
  - "87"   # Action sociale avec hébergement
  - "88"   # Action sociale sans hébergement
  - "96"   # Autres services personnels
  - "62"   # Programmation, conseil et autres activités informatiques (SSII, éditeurs)
  - "63"   # Services d'information
  - "84"   # Administration publique
  - "94"   # Activités d'organisations associatives
  - "97"   # Activités des ménages employeurs
  - "99"   # Activités des organisations extra-territoriales
naf_exclude_exact:
  - "69.10Z"   # Activités juridiques (notaires, avocats)

# DOM-TOM exclus : départements 971-976.
dom_tom_departments: ["971", "972", "973", "974", "976"]

# Signaux web utilisés par le pré-scoring (recherchés dans le HTML de la home + contact).
web_signals:
  pro_area_keywords:
    - "espace pro"
    - "espace client"
    - "espace b2b"
    - "espace partenaire"
    - "extranet"
    - "contact commercial"
    - "service commercial"
    - "espace revendeur"
  commercial_email_prefixes:
    - "commercial"
    - "commerciale"
    - "sales"
    - "ventes"
    - "vente"
    - "contact"
    - "info"
    - "achats"
    - "compta"

# Règles de scoring déterministe.
scoring:
  base: 40
  bonus_pro_area: 5
  bonus_effectif_sweet_spot: 5  # 50-100 salariés
  bonus_phone: 3
  bonus_commercial_email: 3
  malus_no_site: -5
  malus_dom_tom: -8
  malus_effectif_hors_plage: -5

# Volume de sortie
output:
  top_n: 25
  min_score: 45
