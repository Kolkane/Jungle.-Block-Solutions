# ICP — Jungle.Block Solutions (dev solo, IA pour PME services B2B traditionnelles)
# Orientation : PME services B2B 35-200 salariés qui ont des process tertiaires
# manuels (devis, ADV, relances, commandes, RH, support). Mix géographique
# garanti pour ne pas se concentrer dans le Sud-Ouest.

hard_filters:
  effectif_min: 35
  effectif_max: 200
  age_minimum_annees: 2

# Tiers NAF — orientation SERVICES B2B et négoce, pas fabrication lourde.
naf_tiers:
  tier_1:
    bonus: 15
    naf_codes:
      # Services & commerce B2B avec processus tertiaires manuels visibles
      - "46"        # Commerce de gros B2B (devis, ADV, réassort, relances)
      - "49.41A"    # Transport routier de fret interurbain
      - "49.41B"    # Transport routier de fret de proximité
      - "49.42Z"    # Déménagement
      - "52"        # Entreposage et services auxiliaires transport
      - "53"        # Activités postales et de courrier
      - "69.20Z"    # Expertise comptable
      - "70.22Z"    # Conseil pour les affaires
      - "71.12B"    # Ingénierie et études techniques
      - "73"        # Publicité et études de marché (toute la famille)
      - "74"        # Activités spécialisées scientifiques et techniques (design, traduction, photo, traduction…)
      - "78"        # Activités liées à l'emploi (intérim, placement)
      - "79"        # Voyages, agences B2B, tour-opérateurs
      - "80"        # Sécurité privée
      - "81.21Z"    # Nettoyage courant des bâtiments
      - "81.22Z"    # Nettoyage industriel
      - "82"        # Services de soutien aux entreprises (centres d'appels, secrétariat, organisation salons…)

  tier_2:
    bonus: 8
    naf_codes:
      - "18"        # Imprimerie (PME services avec catalogue + devis)
      - "47.74Z"    # Commerce de détail médical
      - "77"        # Location et location-bail (matériel B2B, véhicules pro)
      - "95"        # Réparation d'ordinateurs et biens personnels (services SAV)
      - "33.12Z"    # Réparation de machines et équipements mécaniques (maintenance B2B)
      - "33.14Z"    # Réparation d'équipements électriques
      - "33.20"     # Installation de machines industrielles (sous-traitant industriel, factures B2B)

  tier_3:
    bonus: 0
    min_score: 50     # un peu plus exigeant car loin du cœur de cible
    naf_codes:
      - "26"        # Produits électroniques (hors SSII) — souvent SAV/maintenance B2B
      - "27"        # Équipements électriques — distribution B2B
      - "45.31Z"    # Commerce de gros équipements automobiles (B2B)
      - "45.32Z"    # Commerce de détail équipements automobiles (concessionnaires multi-marques)
      - "47.30Z"    # Commerce de détail carburants (réseaux multi-stations)
      - "21"        # Industrie pharmaceutique (PME distrib/labo, pas grand pharma)

# Refus immédiat — on retire complètement les "constructeurs" et industries lourdes
# qui n'ont pas le profil "services B2B tertiaires" recherché.
naf_exclude_prefixes:
  - "01"   # Agriculture
  - "02"   # Sylviculture
  - "03"   # Pêche
  - "10"   # Industries alimentaires (fabricant, pas distributeur)
  - "11"   # Boissons (fabricant)
  - "13"   # Textile (fabricant)
  - "14"   # Habillement (fabricant)
  - "15"   # Cuir / chaussure
  - "16"   # Travail du bois
  - "17"   # Papier
  - "19"   # Cokéfaction / raffinage
  - "20"   # Chimie
  - "22"   # Caoutchouc / plastique
  - "23"   # Autres produits minéraux non métalliques
  - "24"   # Métallurgie
  - "25"   # Travail des métaux (fabricant)
  - "28"   # Fabrication de machines (constructeur)
  - "29"   # Industrie automobile (constructeur)
  - "30"   # Autres matériels de transport
  - "31"   # Fabrication de meubles
  - "32"   # Autres industries manufacturières
  - "35"   # Énergie
  - "36"   # Eau
  - "37"   # Assainissement
  - "38"   # Déchets
  - "39"   # Dépollution
  - "41"   # Construction de bâtiments
  - "42"   # Génie civil
  - "43"   # Travaux de construction spécialisés (tous : install électrique, thermique…)
  - "55"   # Hébergement
  - "56"   # Restauration
  - "62"   # Programmation informatique (concurrence)
  - "63"   # Services d'information (concurrence)
  - "64"   # Activités financières
  - "65"   # Assurance
  - "66"   # Activités auxiliaires services financiers
  - "84"   # Administration publique
  - "85"   # Enseignement
  - "86"   # Santé humaine
  - "87"   # Action sociale avec hébergement
  - "88"   # Action sociale sans hébergement
  - "90"   # Création artistique
  - "91"   # Bibliothèques, musées
  - "92"   # Jeux de hasard
  - "93"   # Sport et loisirs
  - "94"   # Organisations associatives
  - "96"   # Autres services personnels
  - "97"   # Ménages employeurs
  - "99"   # Organisations extra-territoriales
naf_exclude_exact:
  - "69.10Z"   # Avocats/notaires

dom_tom_departments: ["971", "972", "973", "974", "976"]

# QUOTAS GÉOGRAPHIQUES — garantir un mix entre Île-de-France et reste France.
# Si un bucket atteint son quota max, on rejette les nouveaux leads de ce bucket
# et on continue à fetcher pour remplir l'autre.
geo_quotas:
  ile_de_france:
    departments: ["75", "77", "78", "91", "92", "93", "94", "95"]
    target_pct: 40           # objectif minimum 40% des leads
  metropoles_majeures:
    departments: ["69", "13", "33", "31", "44", "59", "67", "06", "76", "37", "21", "38"]
    target_pct: 30           # Lyon, Marseille, Bordeaux, Toulouse, Nantes, Lille…
  autres:
    departments: []           # tout le reste de la France métropolitaine
    target_pct: 30

# Bonus géo dans le scoring (pour les leads acceptés dans plusieurs buckets,
# privilégier les zones à fort potentiel commercial).
geo_bonus:
  ile_de_france:
    departments: ["75", "92", "93", "94"]
    bonus: 5
  metropoles:
    departments: ["69", "13", "33", "31", "44", "59"]
    bonus: 3

