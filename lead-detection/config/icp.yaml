# ICP — Ideal Customer Profile pour Jungle.Block Solutions (dev solo)
# Cible : PME 30-80 salariés, France métropolitaine, secteurs à ROI IA évident,
# sans DSI interne et sans stack SaaS lourde déjà en place.

hard_filters:
  effectif_min: 30
  effectif_max: 80
  age_minimum_annees: 2

# NAF organisés en 2 tiers (tier 3 retiré : trop équipés en SaaS métier).
naf_tiers:
  tier_1:
    bonus: 15
    naf_codes:
      - "46"        # Commerce de gros B2B (devis/réassort/relances manuels)
      - "49.41A"    # Transport routier de fret interurbain
      - "49.41B"    # Transport routier de fret de proximité
      - "52"        # Entreposage et services auxiliaires des transports
      - "69.20Z"    # Expertise comptable
      - "70.22Z"    # Conseil pour les affaires et autres conseils de gestion
      - "71.12B"    # Ingénierie et études techniques
  tier_2:
    bonus: 8
    naf_codes:
      - "21"        # Industrie pharmaceutique
      - "25"        # Travail des métaux
      - "28"        # Fabrication de machines et équipements
      - "47.74Z"    # Commerce de détail d'articles médicaux et orthopédiques

# Refus immédiat : on ne fetch même pas ces entreprises.
naf_exclude_prefixes:
  - "41"   # Construction de bâtiments
  - "42"   # Génie civil
  - "43"   # Travaux de construction spécialisés
  - "55"   # Hébergement
  - "56"   # Restauration
  - "64"   # Activités des services financiers
  - "65"   # Assurance
  - "66"   # Activités auxiliaires services financiers
  - "85"   # Enseignement
  - "86"   # Santé humaine
  - "87"   # Action sociale avec hébergement
  - "88"   # Action sociale sans hébergement
  - "96"   # Autres services personnels
  - "62"   # Programmation informatique (SSII, éditeurs)
  - "63"   # Services d'information
  - "84"   # Administration publique
  - "94"   # Organisations associatives
  - "97"   # Activités des ménages employeurs
  - "99"   # Organisations extra-territoriales
naf_exclude_exact:
  - "69.10Z"   # Activités juridiques (notaires, avocats)

dom_tom_departments: ["971", "972", "973", "974", "976"]

# Signaux web exploités par le pré-scoring.
web_signals:
  # Détecter "filiale de groupe" → exclusion (DSI groupe bloque).
  subsidiary_keywords:
    - "filiale de"
    - "filiale du groupe"
    - "appartient au groupe"
    - "groupe coté"
    - "subsidiary of"
    - "member of the"
    - "fait partie du groupe"
    - "rejoint le groupe"
    - "société du groupe"

  # SaaS / ERP / CRM déjà installés → l'entreprise est mature, moins urgent.
  # On cherche ces noms dans le HTML, footer, mentions légales, etc.
  saas_heavy_signals:
    - "salesforce"
    - "hubspot"
    - "sap.com"
    - "ariba"
    - "oracle"
    - "microsoft dynamics"
    - "pardot"
    - "marketo"
    - "pipedrive"
    - "zendesk"
    - "intercom"
    - "workday"
    - "sage business cloud"
    - "cegid"
    - "powered by odoo"

  # Présence de "contact commercial" / "espace pro" → entreprise B2B mature.
  pro_area_keywords:
    - "espace pro"
    - "espace client"
    - "espace b2b"
    - "espace partenaire"
    - "extranet"
    - "contact commercial"
    - "service commercial"
    - "espace revendeur"

  # Vocabulaire qui signale des process manuels traditionnels (fit dev solo).
  manual_process_signals:
    - "depuis 19"           # "depuis 1985", "depuis 1999"…
    - "savoir-faire"
    - "tradition"
    - "artisanal"
    - "famille"
    - "demande de devis"
    - "nous consulter pour"
    - "sur demande"
    - "contactez-nous pour"

  commercial_email_prefixes:
    - "commercial"
    - "commerciale"
    - "sales"
    - "ventes"
    - "vente"
    - "contact"
    - "info"
    - "achats"
    - "compta"

# Scoring déterministe.
scoring:
  base: 40
  bonus_pro_area: 5
  bonus_manual_signals: 5       # vocab traditionnel = process à automatiser
  bonus_effectif_sweet_spot: 5  # 50-80 (cœur de cible dev solo)
  bonus_phone: 3
  bonus_commercial_email: 3
  malus_no_site: -5
  malus_saas_heavy: -10         # déjà bien équipée
  malus_dom_tom: -8

# Filtres durs basés sur signaux web : exclusion immédiate.
hard_web_filters:
  exclude_if_subsidiary: true

output:
  top_n: 25
  min_score: 50
